version: "3.8"
services:
  my-postgres:
    image: postgres:15
    container_name: my-postgres
    restart: unless-stopped
    ports:
      - 6000:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
